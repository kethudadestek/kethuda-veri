name: Resmi rakamları güncelle

on:
  schedule:
    - cron: '0 8 3-7 * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: TÜFE verisini çek ve hesapla
        env:
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
        run: node guncelle.mjs
      - name: Değişiklik varsa kaydet
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "kethuda-bot"
            git config user.email "bot@users.noreply.github.com"
            git add parametreler.json
            git commit -m "Resmi rakamlar güncellendi"
            git push
          fi
